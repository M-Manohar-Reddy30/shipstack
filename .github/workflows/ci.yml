name: ShipStack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication:
    name: Authentication Scenario
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scenarios/authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository scenarios
        working-directory: ${{ github.workspace }}
        run: python3 tools/validate_repo.py

      - name: Test repository validator
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scenarios/authentication/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
